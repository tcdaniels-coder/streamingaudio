name: Build desktop installers

on:
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            command: package:mac
            artifact: macOS-installer
          - runner: windows-latest
            command: package:win
            artifact: Windows-installer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter "@workspace/stream-audio-control..."
      - run: pnpm --filter "@workspace/stream-audio-control" run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/stream-audio-control/release/*
          if-no-files-found: error
          retention-days: 30
